
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuot IA</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080808;color:#f5f5f5;
  font-family:Arial,sans-serif;height:100dvh;
  display:flex;flex-direction:column
}
header{
  padding:17px 20px;border-bottom:1px solid #242424;
  display:flex;align-items:center;gap:12px
}
.logo{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,#8b5cf6,#5425c9);
  display:grid;place-items:center;font-size:21px;font-weight:bold
}
header h1{font-size:19px;margin:0}
header small{color:#888;font-size:11px}
main{
  flex:1;overflow-y:auto;padding:20px;
  width:100%;max-width:850px;margin:auto
}
.welcome{text-align:center;margin:55px auto 30px}
.welcome .big{font-size:45px}
.welcome h2{font-size:25px;margin:12px 0}
.welcome p{color:#999;font-size:14px}
.message{
  margin:18px 0;display:flex;flex-direction:column;
  align-items:flex-start
}
.message.user{align-items:flex-end}
.bubble{
  max-width:95%;padding:13px 16px;border-radius:17px;
  background:#171717;line-height:1.65;overflow-wrap:anywhere
}
.user .bubble{background:#33205e}
.bubble img{max-width:100%;border-radius:12px;margin-top:8px}
.bubble pre{
  background:#090909;padding:14px;border-radius:10px;
  overflow-x:auto;border:1px solid #303030
}
.bubble code{font-family:monospace}
.bubble p{margin:7px 0}
.bubble a{color:#b99aff}
.bubble h1,.bubble h2,.bubble h3{margin:15px 0 8px}
.bubble ul,.bubble ol{padding-left:22px}
.copy{
  margin-top:8px;background:#252525;color:white;
  border:0;padding:7px 12px;border-radius:8px
}
.composer{
  width:100%;max-width:850px;margin:0 auto;
  padding:12px 15px 18px
}
.panel{
  background:#151515;border:1px solid #333;
  border-radius:19px;padding:12px
}
#prompt{
  width:100%;background:transparent;color:white;
  border:0;outline:0;resize:none;font-size:16px;
  min-height:48px;max-height:150px;font-family:inherit
}
.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tool{
  background:#252525;border:1px solid #383838;
  color:#ddd;border-radius:10px;padding:10px 12px;
  font-size:13px
}
.tool.active{background:#4b2b83;border-color:#8b5cf6}
#send{
  margin-left:auto;background:#8b5cf6;color:white;
  border:0;border-radius:11px;padding:11px 17px;
  font-weight:bold
}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#previewArea{display:none;padding:8px 0}
#preview{
  width:90px;height:90px;object-fit:cover;
  border-radius:12px;border:1px solid #555
}
#removeImage{
  background:#333;color:white;border:0;
  padding:8px 11px;border-radius:8px;margin-left:8px
}
#status{color:#999;font-size:12px;padding:7px 2px}
#generated{max-width:100%;border-radius:14px;margin-top:10px}
footer{text-align:center;color:#666;font-size:10px;padding:0 10px 8px}
@media(max-width:500px){
  main{padding:14px}
  .welcome{margin-top:45px}
  .tool{padding:9px;font-size:12px}
  .composer{padding:8px}
}
</style>
</head>

<body>

<header>
  <div class="logo">F</div>
  <div>
    <h1>Fuot IA</h1>
    <small>Sua inteligência artificial</small>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <div class="big">✦</div>
    <h2>Como posso ajudar?</h2>
    <p>Faça perguntas, programe, envie imagens ou crie algo novo.</p>
  </div>
</main>

<div class="composer">
  <div class="panel">

    <div id="previewArea">
      <img id="preview" alt="Prévia da imagem">
      <button id="removeImage" type="button">Remover foto ✕</button>
    </div>

    <textarea id="prompt" placeholder="Pergunte alguma coisa..."></textarea>

    <div class="actions">
      <button class="tool" id="gallery" type="button">＋ Galeria</button>
      <button class="tool" id="camera" type="button">📷 Câmera</button>
      <button class="tool" id="imageMode" type="button">🎨 Criar imagem</button>
      <button id="send" type="button">Enviar ↑</button>
    </div>

    <input id="fileGallery" type="file" accept="image/*" hidden>
    <input id="fileCamera" type="file" accept="image/*" capture="environment" hidden>
    <div id="status"></div>
  </div>
</div>

<footer>Fuot IA • Respostas podem precisar de verificação</footer>

<script>
const API = "https://fuot-ia-api.ericksouzaneri8.workers.dev";

const chat = document.getElementById("chat");
const promptInput = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const statusText = document.getElementById("status");
const galleryInput = document.getElementById("fileGallery");
const cameraInput = document.getElementById("fileCamera");
const previewArea = document.getElementById("previewArea");
const preview = document.getElementById("preview");
const imageModeButton = document.getElementById("imageMode");

let selectedImage = null;
let imageMode = false;
let history = [];
let busy = false;

document.getElementById("gallery").onclick = () => galleryInput.click();
document.getElementById("camera").onclick = () => cameraInput.click();

imageModeButton.onclick = () => {
  imageMode = !imageMode;
  imageModeButton.classList.toggle("active", imageMode);
  promptInput.placeholder = imageMode
    ? "Descreva a imagem que deseja criar..."
    : "Pergunte alguma coisa...";
};

galleryInput.onchange = handleFile;
cameraInput.onchange = handleFile;

async function handleFile(event) {
  const file = event.target.files?.[0];
  event.target.value = "";

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    statusText.textContent = "Escolha um arquivo de imagem.";
    return;
  }

  try {
    statusText.textContent = "Preparando imagem...";
    selectedImage = await compressImage(file);
    preview.src = selectedImage;
    previewArea.style.display = "block";
    statusText.textContent = "Imagem pronta para enviar.";
  } catch (error) {
    statusText.textContent = "Não foi possível abrir essa imagem.";
  }
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const img = new Image();

      img.onload = () => {
        const max = 1100;
        const scale = Math.min(1, max / Math.max(img.width, img.height));

        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        resolve(canvas.toDataURL("image/jpeg", 0.78));
      };

      img.onerror = reject;
      img.src = reader.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById("removeImage").onclick = () => {
  selectedImage = null;
  preview.src = "";
  previewArea.style.display = "none";
  statusText.textContent = "";
};

function addMessage(role, content, image = null) {
  document.getElementById("welcome")?.remove();

  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (image) {
    const img = document.createElement("img");
    img.src = image;
    img.alt = "Imagem enviada";
    bubble.appendChild(img);
  }

  if (content) {
    const text = document.createElement("div");

    if (role === "assistant" && window.marked && window.DOMPurify) {
      text.innerHTML = DOMPurify.sanitize(marked.parse(content));
    } else {
      text.textContent = content;
    }

    bubble.appendChild(text);
  }

  wrapper.appendChild(bubble);

  if (role === "assistant" && content) {
    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "Copiar resposta";

    copy.onclick = async () => {
      await navigator.clipboard.writeText(content);
      copy.textContent = "Copiado!";
    };

    wrapper.appendChild(copy);
  }

  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;
  return wrapper;
}

async function sendMessage() {
  if (busy) return;

  const prompt = promptInput.value.trim();
  const image = selectedImage;

  if (!prompt && !image) return;

  busy = true;
  sendButton.disabled = true;
  statusText.textContent = "A Fuot IA está pensando...";

  if (imageMode && image) {
    statusText.textContent = "Para criar uma imagem, retire a foto anexada e descreva o que deseja.";
    busy = false;
    sendButton.disabled = false;
    return;
  }

  addMessage("user", prompt, image);

  promptInput.value = "";
  selectedImage = null;
  preview.src = "";
  previewArea.style.display = "none";

  const loading = addMessage("assistant", "Pensando...");

  try {
    let data;

    if (imageMode) {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "generate_image",
          prompt
        })
      });

      data = await response.json();

      if (!response.ok) {
        throw new Error(data.details || data.error || "Falha ao criar imagem.");
      }

      loading.querySelector(".bubble").textContent = "Imagem criada!";

      const img = document.createElement("img");
      img.id = "generated";
      img.src = data.image;
      img.alt = "Imagem gerada pela Fuot IA";
      loading.querySelector(".bubble").appendChild(img);

    } else {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "chat",
          prompt,
          image,
          history
        })
      });

      data = await response.json();

      if (!response.ok) {
        throw new Error(data.details || data.error || "Falha ao obter resposta.");
      }

      if (!data.answer) {
        throw new Error("O servidor não retornou uma resposta.");
      }

      loading.remove();
      addMessage("assistant", data.answer);

      if (!image) {
        history.push({ role: "user", content: prompt });
        history.push({ role: "assistant", content: data.answer });
        history = history.slice(-12);
      }
    }

    statusText.textContent = "";

  } catch (error) {
    loading.querySelector(".bubble").textContent =
      "Não consegui concluir: " + error.message;
    statusText.textContent = "Verifique a conexão e tente novamente.";
  } finally {
    busy = false;
    sendButton.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}

sendButton.onclick = sendMessage;

promptInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
